<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartel Convsersatorio acetChile 2026</title>
    <!-- PLEASE NO CHANGES BELOW THIS LINE (UNTIL I SAY SO) -->
  <script language="javascript" type="text/javascript" src="libraries/p5.min.js"></script>
  <script language="javascript" type="text/javascript" src="sketch_260519a.js"></script>
  <!-- OK, YOU CAN MAKE CHANGES BELOW THIS LINE AGAIN -->
    <style>
        /* --- ESTILOS GENERALES Y BASE --- */
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .contenedor-cartel {
            position: relative;
            width: 1080px;
            height: 1350px;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.5);
            flex-shrink: 0; 
        }

        /* Forzamos a que las capas internas hereden de forma proporcional las medidas del contenedor */
        canvas, .mascara-vectorial {
            position: absolute;
            top: 0;
            left: 0;
            width: 100% !important;
            height: 100% !important;
        }

        .mascara-vectorial {
            z-index: 2;
            pointer-events: none;
            mix-blend-mode: multiply; 
        }

        /* --- BOTÓN DE DESCARGA COMPLETAMENTE CENTRADO --- */
        #btn-descargar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            /* El transform-origin y translate aseguran un centrado matemático exacto en el eje X */
            transform: translateX(-50%);
            z-index: 10;
            background-color: blue;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            font-family: sans-serif;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.3);
            transition: background-color 0.2s ease, color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
        }

        #btn-descargar:hover {
            background-color: white;
            color: blue;
            /* Mantiene su posición centrada en X sumando la ligera elevación visual del hover */
            transform: translateX(-50%) translateY(-2px);
            box-shadow: 0px 6px 20px rgba(255,255,255,.1);
        }

        #btn-descargar:active {
            transform: translateX(-50%) translateY(0);
        }

        /* --- REGLA PARA ESCRITORIO (LAPTOPS / MACBOOK) --- */
        @media (min-width: 601px) {
            .contenedor-cartel {
                /* Tu escala favorita para que quepa en tu pantalla actual */
                transform: scale(0.45); 
                transform-origin: center center;
            }
        }

        /* --- REGLA PARA PANTALLAS CHICAS (CELULARES) --- */
        @media (max-width: 600px) {
            .contenedor-cartel {
                /* Redefinimos las dimensiones de la caja al 90% del ancho del móvil */
                width: 90vw !important;
                /* El alto se calcula automáticamente a escala estricta 4:5 */
                height: calc(90vw * 1.25) !important;
                /* Desactivamos el transform de escritorio para centrar nativamente por Flexbox */
                transform: none !important;
            }

            #btn-descargar {
                bottom: 15px !important;
                padding: 10px 18px !important;
                font-size: 12px !important;
            }
        }
    </style>
</head>
<body>
    <!-- Contenedor del cartel limpio y optimizado -->
    <div class="contenedor-cartel">
        <img src="data/mask.svg" class="mascara-vectorial" alt="Máscara de texto">
    </div>

    <!-- Botón flotante para descargar el PNG -->
    <button id="btn-descargar" onclick="procesarDescarga()">descargar cartel</button>

    <!-- Vinculamos tu script de Processing/p5.js al final -->
    <script src="sketch.js"></script>
</body>
</html>
